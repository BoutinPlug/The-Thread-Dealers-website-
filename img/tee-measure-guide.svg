<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">T-shirt measurement guide</title>
  <desc id="desc">An illustrated T-shirt with measurement arrows for length, shoulder width, chest and sleeve length.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#b63d22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g fill="none" stroke="#fffaf2" stroke-width="6" stroke-linecap="round"><path d="M166 30V269"/><path d="M246 62H395"/><path d="M221 159H419"/><path d="M402 76L450 125"/></g>
  <g fill="none" stroke="#b63d22" stroke-width="2.7" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M166 30V269"/><path d="M246 62H395"/><path d="M221 159H419"/><path d="M402 76L450 125"/></g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#06263a" letter-spacing=".3">
    <text x="320" y="45" text-anchor="middle">SHOULDER</text><text x="320" y="183" text-anchor="middle">CHEST / BUST</text><text x="466" y="110">SLEEVE</text><text x="85" y="155">LENGTH</text>
  </g>
</svg>
